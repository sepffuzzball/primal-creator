name: CI

on:
  pull_request:

# Validate only; never publishes. Publishing is handled by the Docker workflow.
permissions:
  contents: read

jobs:
  validate:
    name: Validate (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  db-smoke:
    name: DB integration smoke (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primal_creator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primal_creator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator?schema=public
      AUTH_SECRET: ci-only-auth-secret-for-primal-creator-smoke-123
      ADMIN_EMAIL: admin@primal.local
      ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations (explicit, no auto-migration in requests)
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Run DB smoke check
        run: node scripts/db-smoke.mjs
