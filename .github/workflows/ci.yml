name: CI

on:
  pull_request:

# Validate only; never publishes. Publishing is handled by the Docker workflow.
permissions:
  contents: read

jobs:
  validate:
    name: Validate (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  db-smoke:
    name: DB integration smoke (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primal_creator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primal_creator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator?schema=public
      AUTH_SECRET: ci-only-auth-secret-for-primal-creator-smoke-123
      ADMIN_EMAIL: admin@primal.local
      ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations (explicit, no auto-migration in requests)
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Run DB smoke check
        run: node scripts/db-smoke.mjs

  db-integration:
    name: DB integration tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primal_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primal_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated test DB - never the dev/prod `primal_creator` database. The
      # real-Postgres integration tests run only when RUN_DB_INTEGRATION_TESTS=1
      # AND the DB name is a test DB (`_test`/`test_`).
      RUN_DB_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-for-primal-creator-smoke-123
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations (test DB, no auto-migration in requests)
        run: pnpm db:migrate

      - name: Run unit suite with DB integration tests enabled
        run: pnpm test

  browser-checks:
    name: Playwright browser checks (chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primal_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primal_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Opt in to browser E2E and point the server at an isolated test database
      # (name contains `_test`) so the run can never touch the dev `primal_creator`
      # database.
      RUN_BROWSER_TESTS: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-for-primal-creator-browserchecks-123
      # Test-only admin credentials (strong, non-placeholder). E2E_ADMIN_* mirror
      # the seeded ADMIN_* so the UI login uses them.
      ADMIN_EMAIL: admin@primal.local
      ADMIN_PASSWORD: PrimalE2eStrongPass-9713
      E2E_ADMIN_EMAIL: admin@primal.local
      E2E_ADMIN_PASSWORD: PrimalE2eStrongPass-9713
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations (test DB, no auto-migration in requests)
        run: pnpm db:migrate

      - name: Seed database (test-only admin + catalog, no sample characters)
        run: pnpm db:seed

      - name: Run Playwright browser checks
        run: pnpm test:e2e
