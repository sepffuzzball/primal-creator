name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Scoped token: only read repo contents and write to GHCR packages on this repo.
permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Prerequisite checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx}"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  db-checks:
    name: DB integration checks (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primal_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primal_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Isolated test DB - never the dev/prod `primal_creator` database. The
      # real-Postgres integration tests for the auth/drafts/portrait workflows run
      # only when RUN_DB_INTEGRATION_TESTS=1 AND the effective DATABASE_URL names a
      # test database (`_test`/`test_`). TEST_DATABASE_URL is preferred by
      # lib/test/db-integration.setup.ts, which points the Prisma singleton at it
      # before any test constructs it; the gate still validates the name.
      RUN_DB_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-for-primal-creator-dbchecks-123
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations (test DB, no auto-migration in requests)
        run: pnpm db:migrate

      - name: Run unit suite with DB integration tests enabled
        run: pnpm test

  browser-checks:
    name: Playwright browser checks (chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primal_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primal_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Opt in to browser E2E and point the server at an isolated test database
      # (name contains `_test`) so the run can never touch the dev `primal_creator`
      # database.
      RUN_BROWSER_TESTS: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/primal_creator_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-for-primal-creator-dockerbrowser-123
      # Test-only admin credentials (strong, non-placeholder). E2E_ADMIN_* mirror
      # the seeded ADMIN_* so the UI login uses them.
      ADMIN_EMAIL: admin@primal.local
      ADMIN_PASSWORD: PrimalE2eStrongPass-9713
      E2E_ADMIN_EMAIL: admin@primal.local
      E2E_ADMIN_PASSWORD: PrimalE2eStrongPass-9713
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations (test DB, no auto-migration in requests)
        run: pnpm db:migrate

      - name: Seed database (test-only admin + catalog, no sample characters)
        run: pnpm db:seed

      - name: Run Playwright browser checks
        run: pnpm test:e2e

  publish:
    name: Build & push multi-arch image
    needs: [checks, db-checks, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Publish a Docker tag equal to the root package.json semver on every push
      # to main (alongside the existing branch/sha/latest tags). Built via Node
      # so the value is never hardcoded; the release process only bumps
      # package.json, and this image tag follows automatically.
      - name: Read package version
        id: version
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const v = pkg.version;
          // Semver-like MAJOR.MINOR.PATCH with optional -prerelease and +build
          // metadata (build metadata is not valid in a Docker tag, so drop it).
          const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/);
          if (!m) {
            console.error(`Invalid semver-like version "${v}" in package.json`);
            process.exit(1);
          }
          const build = m[5] ? `+${m[5]}` : '';
          const clean = v.replace(build, '');
          // Docker tags: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}.
          if (!/^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$/.test(clean)) {
            console.error(`Version "${v}" is not a safe Docker tag after cleaning (got "${clean}")`);
            process.exit(1);
          }
          console.log(`version=${clean}`);
          EOF

      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sepffuzzball/primal-creator
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            # Compose defaults to `latest`; publish it on main so `docker compose
            # up` resolves to the latest main build without an explicit tag.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Mirror the root package.json semver as an image tag on pushes to
            # main only, so `docker pull` can target a version exactly.
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
